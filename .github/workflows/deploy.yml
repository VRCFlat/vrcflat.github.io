name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ] # mainブランチにpushされたら動く
  workflow_dispatch: # 手動実行もできるようにする

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Astro
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Node.js 20 非推奨警告を回避
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          submodules: false # tool submodule is not needed for Astro build

      - name: Install, shadowload, and Build
        uses: withastro/action@v3
        with:
          path: "./astro" # ← ここで「Astroはサブフォルダにあるよ」と教えています
          node-version: 22 # Astro v6 用 Node.js 22 以上が必要

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Node.js 20 非推奨警告を回避
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4